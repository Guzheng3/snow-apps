<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prototype - Border Style Popover Regression</title>
    <style>
      /* PROTOTYPE: compare the current regression with the intended compact layout. */
      :root {
        color: #20242a;
        font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 760px;
        margin: 0;
        background: #e9edf2;
      }

      main {
        max-width: 1120px;
        margin: 32px auto;
        padding: 0 24px 84px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        font-weight: 650;
      }

      .intro {
        margin-top: 8px;
        color: #5e6875;
        font-size: 14px;
      }

      .comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-top: 24px;
      }

      .example {
        min-width: 0;
      }

      .example-heading {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }

      .example-heading h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
      }

      .badge {
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 12px;
      }

      .badge.bad {
        color: #b42318;
        background: #ffebe9;
      }

      .badge.good {
        color: #067647;
        background: #e9f9ee;
      }

      .stage {
        position: relative;
        min-height: 580px;
        overflow: hidden;
        border: 1px solid #d5dce5;
        background: linear-gradient(155deg, #e3e9ef, #cfd8e2);
      }

      .selection {
        position: absolute;
        top: 166px;
        right: 44px;
        left: 44px;
        height: 190px;
        border: 2px solid #1677ff;
        border-radius: 9px;
        background: rgba(255, 222, 222, 0.7);
      }

      .selection::before,
      .selection::after {
        position: absolute;
        top: -6px;
        width: 9px;
        height: 9px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #1677ff;
        content: "";
      }

      .selection::before {
        left: -6px;
      }

      .selection::after {
        right: -6px;
      }

      .properties-popover {
        position: absolute;
        top: 28px;
        right: 22px;
        width: 208px;
        border: 1px solid #dce3ec;
        border-radius: 10px;
        padding: 14px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(34, 47, 62, 0.16);
      }

      .section + .section {
        margin-top: 16px;
      }

      .section-title {
        margin-bottom: 7px;
        color: #4a5563;
        font-size: 13px;
        font-weight: 600;
      }

      .colors,
      .widths {
        display: flex;
        align-items: center;
        gap: 7px;
      }

      .color {
        width: 23px;
        height: 23px;
        border: 1px solid #c7d0dc;
        border-radius: 4px;
      }

      .color.active {
        outline: 2px solid #91caff;
        outline-offset: 1px;
      }

      .width {
        display: flex;
        width: 36px;
        height: 26px;
        align-items: center;
        justify-content: center;
        border: 1px solid #e3e7ed;
        border-radius: 7px;
      }

      .width span {
        width: 21px;
        border-top: 3px solid #1677ff;
        border-radius: 2px;
      }

      .width.medium span {
        border-top-width: 5px;
      }

      .width.large span {
        border-top-width: 8px;
      }

      .slider {
        width: 100%;
        height: 4px;
        margin-top: 14px;
        border-radius: 4px;
        background: #e9eef5;
      }

      .slider::before {
        display: block;
        width: 15px;
        height: 15px;
        margin-top: -6px;
        margin-left: 10px;
        border: 2px solid #91caff;
        border-radius: 50%;
        background: #fff;
        content: "";
      }

      /* Current state: uncontained radio inputs flow as full-width block rows. */
      .regressed-group {
        display: block;
      }

      .regressed-option {
        display: flex;
        width: 100%;
        height: 124px;
        align-items: flex-start;
        padding: 1px 0;
      }

      .regressed-option input {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: #1677ff;
      }

      .regressed-option .line-preview {
        align-self: center;
        margin-left: 24px;
      }

      /* Fixed state: equivalent to the removed compact CSS constraints. */
      .compact-group {
        display: inline-flex;
        flex-flow: row nowrap;
        align-items: center;
      }

      .compact-option {
        display: inline-flex;
        width: 42px;
        height: 24px;
        min-height: 24px;
        align-items: center;
        justify-content: center;
        border: 1px solid #d9e0e8;
        border-right: 0;
        background: #fff;
        cursor: pointer;
      }

      .compact-option:first-child {
        border-radius: 5px 0 0 5px;
      }

      .compact-option:last-child {
        border-right: 1px solid #d9e0e8;
        border-radius: 0 5px 5px 0;
      }

      .compact-option.active {
        position: relative;
        z-index: 1;
        border-color: #1677ff;
        background: #e6f4ff;
      }

      .compact-option input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .line-preview {
        width: 22px;
        border-top: 2px solid #252a31;
      }

      .line-preview.dashed {
        border-top-style: dashed;
      }

      .line-preview.dotted {
        border-top: 3px dotted #252a31;
      }

      .measure {
        margin-top: 12px;
        color: #637083;
        font-size: 12px;
        line-height: 1.55;
      }

      .switcher {
        position: fixed;
        right: 24px;
        bottom: 20px;
        display: flex;
        padding: 5px;
        border-radius: 8px;
        background: #1f2937;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.24);
      }

      .switcher button {
        border: 0;
        border-radius: 5px;
        padding: 7px 10px;
        color: #dbe5f0;
        background: transparent;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }

      .switcher button[aria-pressed="true"] {
        color: #fff;
        background: #3b82f6;
      }

      body[data-view="current"] .fixed-example,
      body[data-view="fixed"] .current-example {
        display: none;
      }

      body[data-view="current"] .comparison,
      body[data-view="fixed"] .comparison {
        grid-template-columns: minmax(0, 520px);
        justify-content: center;
      }

      @media (max-width: 820px) {
        body {
          min-width: 0;
        }

        .comparison {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-view="compare">
    <!-- Two variants of the property popover, switchable by ?view=compare|current|fixed. -->
    <main>
      <h1>属性二级弹窗：边框样式回归对照</h1>
      <p class="intro">左侧复现当前截图的纵向撑开，右侧为恢复紧凑约束后的目标状态。</p>

      <section class="comparison">
        <article class="example current-example">
          <div class="example-heading">
            <h2>当前运行状态</h2>
            <span class="badge bad">回归</span>
          </div>
          <div class="stage">
            <div class="selection"></div>
            <aside class="properties-popover" aria-label="当前属性弹窗">
              <div class="section">
                <div class="section-title">描边</div>
                <div class="colors">
                  <span class="color" style="background:#202124"></span>
                  <span class="color active" style="background:#f04438"></span>
                  <span class="color" style="background:#40a84d"></span>
                  <span class="color" style="background:#287fc5"></span>
                  <span class="color" style="background:#f39b25"></span>
                </div>
              </div>
              <div class="section">
                <div class="section-title">描边宽度</div>
                <div class="widths"><span class="width"><span></span></span><span class="width medium"><span></span></span><span class="width large"><span></span></span></div>
                <div class="slider"></div>
              </div>
              <div class="section">
                <div class="section-title">边框样式</div>
                <div class="regressed-group" aria-label="边框样式">
                  <label class="regressed-option"><input checked type="radio" name="regressed" /><span class="line-preview"></span></label>
                  <label class="regressed-option"><input type="radio" name="regressed" /><span class="line-preview dashed"></span></label>
                  <label class="regressed-option"><input type="radio" name="regressed" /><span class="line-preview dotted"></span></label>
                </div>
              </div>
            </aside>
          </div>
          <p class="measure">3 个选项各占 124px 高，面板会被纵向拉长，和截图一致。</p>
        </article>

        <article class="example fixed-example">
          <div class="example-heading">
            <h2>恢复后目标状态</h2>
            <span class="badge good">修复</span>
          </div>
          <div class="stage">
            <div class="selection"></div>
            <aside class="properties-popover" aria-label="修复后的属性弹窗">
              <div class="section">
                <div class="section-title">描边</div>
                <div class="colors">
                  <span class="color" style="background:#202124"></span>
                  <span class="color active" style="background:#f04438"></span>
                  <span class="color" style="background:#40a84d"></span>
                  <span class="color" style="background:#287fc5"></span>
                  <span class="color" style="background:#f39b25"></span>
                </div>
              </div>
              <div class="section">
                <div class="section-title">描边宽度</div>
                <div class="widths"><span class="width"><span></span></span><span class="width medium"><span></span></span><span class="width large"><span></span></span></div>
                <div class="slider"></div>
              </div>
              <div class="section">
                <div class="section-title">边框样式</div>
                <div class="compact-group" aria-label="边框样式">
                  <label class="compact-option active"><input checked type="radio" name="fixed" /><span class="line-preview"></span></label>
                  <label class="compact-option"><input type="radio" name="fixed" /><span class="line-preview dashed"></span></label>
                  <label class="compact-option"><input type="radio" name="fixed" /><span class="line-preview dotted"></span></label>
                </div>
              </div>
            </aside>
          </div>
          <p class="measure">`inline-flex + nowrap` 固定单排；每项 42 x 24px，图标预览保持 22px。</p>
        </article>
      </section>
    </main>

    <nav class="switcher" aria-label="原型视图">
      <button data-view="compare" aria-pressed="true">对照</button>
      <button data-view="current" aria-pressed="false">当前</button>
      <button data-view="fixed" aria-pressed="false">修复后</button>
    </nav>

    <script>
      const validViews = new Set(["compare", "current", "fixed"]);
      const initialView = new URLSearchParams(location.search).get("view");
      const setView = (view) => {
        const nextView = validViews.has(view) ? view : "compare";
        document.body.dataset.view = nextView;
        document.querySelectorAll(".switcher button").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.view === nextView));
        });
        const url = new URL(location.href);
        url.searchParams.set("view", nextView);
        history.replaceState(null, "", url);
      };

      document.querySelectorAll(".switcher button").forEach((button) => {
        button.addEventListener("click", () => setView(button.dataset.view));
      });
      setView(initialView);
    </script>
  </body>
</html>
